# n8n Automation → n8n:5678
server {
    listen 80;
    server_name n8n.kidspiano.local;
    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
