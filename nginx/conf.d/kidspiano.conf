# Game Frontend → piano-frontend:3000
server {
    listen 80;
    server_name play.kidspiano.local kidspiano.local;
    location / {
        proxy_pass http://piano-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}

# CMS Admin → piano-admin:3001
server {
    listen 80;
    server_name admin.kidspiano.local;
    location / {
        proxy_pass http://piano-admin:3001;
