# KidsPiano - Docker Compose chỉ cho PostgreSQL (local dev)
# Dùng file này khi bạn chạy các service bằng npm/python trực tiếp

version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kidspiano
      POSTGRES_PASSWORD: kidspiano123
      POSTGRES_DB: kidspiano
    volumes:
      - postgres-local-data:/var/lib/postgresql/data

volumes:
  postgres-local-data:
