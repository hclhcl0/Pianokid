version: '3.9'

networks:
  kidspiano-net:
    driver: bridge

services:

  midi-service:
    build: ./midi-service
    restart: unless-stopped
    networks:
      - kidspiano-net
    labels:
      - coolify.managed=true

  piano-backend:
    build: ./piano-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3001
      NODE_ENV: production
      MIDI_SERVICE_URL: ${MIDI_SERVICE_URL:-http://midi-service:8000}
    networks:
      - kidspiano-net
    depends_on:
      - midi-service
    labels:
      - coolify.managed=true
    # Coolify sẽ tự thêm traefik labels cho domain qua UI
    # Không cần expose port ở đây, Coolify Proxy lo

  piano-frontend:
    build:
      context: ./piano-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    networks:
      - kidspiano-net
    depends_on:
      - piano-backend
    labels:
      - coolify.managed=true

  piano-admin:
    build:
      context: ./piano-admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    networks:
      - kidspiano-net
    depends_on:
      - piano-backend
    labels:
      - coolify.managed=true
